  <g stroke="#4dd0c4" stroke-width="2" marker-end="url(#a)"><line x1="212" y1="95" x2="246" y2="95"/><line x1="442" y1="95" x2="476" y2="95"/><line x1="672" y1="95" x2="706" y2="95"/></g>
  <text x="450" y="182" fill="#8b98a9" font-size="13" text-anchor="middle">The tag is the version of record. The release must be published, not a draft or pre-release.</text>
