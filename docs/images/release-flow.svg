<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4dd0c4"/></marker></defs>
  <rect width="900" height="200" rx="12" fill="#0f141c"/>
  <g fill="#161d29" stroke="#2a3446" stroke-width="1.5">
    <rect x="20" y="40" width="190" height="110" rx="10"/><rect x="250" y="40" width="190" height="110" rx="10"/>
    <rect x="480" y="40" width="190" height="110" rx="10"/><rect x="710" y="40" width="170" height="110" rx="10"/>
  </g>
  <g fill="#4dd0c4" font-size="16" font-weight="700" text-anchor="middle">
    <text x="115" y="72">Push tag vX.Y.Z</text><text x="345" y="72">GitHub Actions</text>
    <text x="575" y="72">GitHub Release</text><text x="795" y="72">GW Studio app</text>
  </g>
