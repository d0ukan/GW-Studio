name: Release

# Push a tag like v1.1.2 to build and publish a GitHub Release with:
#   - GW-Studio-Setup-vX.Y.Z.exe   (installer; the in-app updater downloads this asset)
#   - GW-Studio-Portable-vX.Y.Z.zip
# The in-app updater reads the latest GitHub Release, so the tag (vX.Y.Z) is the version of record.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v(\d+\.\d+\.\d+)$') { $v = $Matches[1] } else { $v = "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          # Uses the "# vX.Y.Z" section of CHANGELOG.md as the release body (shown in the in-app update prompt).
          $v = "${{ steps.ver.outputs.version }}"
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $out = @(); $in = $false
          foreach ($l in $lines) {
            if ($l -match '^# v?(\d+\.\d+\.\d+)') { if ($in) { break }; if ($Matches[1] -eq $v) { $in = $true; continue } }
            elseif ($in) { $out += $l }
          }
          $body = ($out -join "`n").Trim()
          if (-not $body) { $body = "GW Studio v$v" }
          Set-Content -Path release-notes.md -Value $body -Encoding UTF8

      - name: Run tests
        run: dotnet run --project Tests/GW-Studio.Tests.csproj -c Release

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish GW-Studio.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$v -p:AssemblyVersion=$v.0 -p:FileVersion=$v.0 -p:InformationalVersion=$v `
            -o publish

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $dir = "dist/GW-Studio-Portable-v$v"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item publish/* $dir -Recurse -Exclude *.pdb
          # Marker: tells the app it is Portable (no installer-based self update).
          New-Item -ItemType File -Force "$dir/portable.txt" | Out-Null
          Compress-Archive -Path $dir -DestinationPath "dist/GW-Studio-Portable-v$v.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" "/DPublishDir=..\publish" installer\GW-Studio.iss
          Copy-Item "installer/Output/GW-Studio-Setup-v$v.exe" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: gw-studio-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          name: GW Studio v${{ steps.ver.outputs.version }}
